<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="ttl desc">
<title id="ttl">The Charnwood Intimacy therapy room</title>
<desc id="desc">An illustration of the therapy room seen from the side: a tall industrial multi-pane window with a large radiator beneath it, a rust sofa on the left where the therapist sits in profile with a grey bob and a blazer, nodding slowly, and a deep green sofa on the right where a client with short hair sits in profile facing her, gesturing as they speak. A small hairpin-leg table with a mug sits between them, with shelves of plants and books on the left, a swaying monstera in a terracotta pot on the right and a chevron jute rug across the floor.</desc>
