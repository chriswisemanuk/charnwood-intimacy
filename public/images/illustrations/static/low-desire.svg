<title id="ttl">Low desire and mismatched libido</title>
<desc id="desc">Two people sit apart on the edge of a bed in a quiet room. One, in orange, leans across and reaches out with an open hand as a small heart rises above them. The other, in teal, sits turned away with hands in their lap and slowly drifts further off, leaving a gap between them.</desc>
